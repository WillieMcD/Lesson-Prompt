<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Lesson Builder AIM</title>

  <style>
    @font-face {
      font-family: "Aptos";
      src: url("Aptos.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Aptos";
      src: url("Aptos-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Aptos";
      src: url("Aptos-ExtraBold.ttf") format("truetype");
      font-weight: 800;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Aptos";
      src: url("Aptos-Italic.ttf") format("truetype");
      font-weight: 400;
      font-style: italic;
      font-display: swap;
    }

    @font-face {
      font-family: "Aptos Display";
      src: url("Aptos-Display.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Aptos Display";
      src: url("Aptos-Display-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      /* COPC brand palette */
      --colour-midnight: #091f2c;
      --colour-yellow: #eedc00;
      --colour-cyan: #0de9e9;
      --colour-blue: #3636ff;
      --colour-green: #91e905;
      --colour-purple: #dd4ef4;

      /* COPC darker support colours */
      --colour-blue-dark: #0000c8;
      --colour-cyan-dark: #008eaa;
      --colour-green-dark: #66a500;

      /* Neutral palette */
      --colour-white: #ffffff;
      --colour-midnight-10: #e7e9ea;
      --colour-midnight-20: #cfd2d5;
      --colour-midnight-30: #a0a5ab;
      --colour-grey-text: #4b5563;

      /* UI tokens */
      --page-max-width: 980px;
      --surface-background: var(--colour-white);
      --page-background: var(--colour-midnight-10);
      --text-primary: var(--colour-midnight);
      --text-secondary: var(--colour-grey-text);
      --border-default: var(--colour-midnight-20);
      --action-primary: var(--colour-blue);
      --action-primary-hover: var(--colour-blue-dark);
      --focus-ring: var(--colour-yellow);
      --radius-card: 14px;
      --radius-control: 10px;
      --shadow-card: 0 8px 24px rgba(9, 31, 44, 0.12);
      --spacing-page: 18px;
      --spacing-card: 16px;
      --spacing-section: 16px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100%;
      margin: 0;
      font-family: "Aptos", "Aptos Display", "Calibri", Arial, Helvetica, sans-serif;
      color: var(--text-primary);
      line-height: 1.5;
      background: linear-gradient(
        180deg,
        var(--colour-midnight) 0,
        var(--colour-midnight) 150px,
        var(--page-background) 150px,
        var(--page-background) 100%
      );
    }

    .skip-link {
      position: absolute;
      top: -48px;
      left: 16px;
      z-index: 1000;
      padding: 10px 14px;
      color: var(--colour-white);
      font-weight: 700;
      background: var(--action-primary);
      border-radius: 8px;
    }

    .skip-link:focus {
      top: 16px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-shell {
      width: 100%;
      max-width: var(--page-max-width);
      margin: 0 auto;
      padding: var(--spacing-page);
    }

    .app-header {
      position: relative;
      margin-bottom: 16px;
      padding: 10px 0 8px;
      color: var(--colour-white);
      text-align: left;
    }

    .app-header::after {
      content: "";
      display: block;
      width: 112px;
      height: 6px;
      margin-top: 12px;
      background: linear-gradient(
        90deg,
        var(--colour-yellow) 0 25%,
        var(--colour-cyan) 25% 50%,
        var(--colour-purple) 50% 75%,
        var(--colour-green) 75% 100%
      );
      border-radius: 999px;
    }

    .app-title {
      margin: 0 0 8px;
      font-family: "Aptos Display", "Aptos", "Calibri", Arial, Helvetica, sans-serif;
      font-size: clamp(1.5rem, 3vw, 2.1rem);
      font-weight: 700;
      line-height: 1.15;
    }

    .app-description {
      max-width: 760px;
      margin: 0;
      color: var(--colour-midnight-10);
      font-size: 0.98rem;
    }

    .builder-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .panel {
      padding: var(--spacing-card);
      background: var(--surface-background);
      border: 1px solid var(--border-default);
      border-top: 6px solid var(--colour-blue);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
    }

    .panel--output {
      border-top-color: var(--colour-cyan);
    }

    .panel-title,
    legend {
      margin: 0 0 12px;
      color: var(--colour-midnight);
      font-size: 1.1rem;
      font-weight: 800;
      line-height: 1.2;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    .field {
      margin-bottom: var(--spacing-section);
    }

    .field__label {
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .field__control {
      width: 100%;
      min-height: 44px;
      padding: 8px 10px;
      color: var(--text-primary);
      font: inherit;
      font-size: 16px;
      background: var(--colour-white);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-control);
    }

    textarea.field__control {
      min-height: 100px;
      resize: vertical;
    }

    textarea.field__control--output {
  min-height: 300px;
  white-space: pre-wrap;
  overflow-wrap: break-word;
}

    .field__control--output {
      min-height: 330px;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 12px;
    }

    .actions--form {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--border-default);
    }

    .button {
      min-height: 44px;
      padding: 8px 14px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      border: 0;
      border-radius: var(--radius-control);
    }

    .button--primary {
      color: var(--colour-white);
      background: var(--action-primary);
    }

    .button--primary:hover {
      background: var(--action-primary-hover);
    }

    .button--secondary {
      color: var(--colour-midnight);
      background: var(--colour-midnight-10);
      border: 1px solid var(--colour-midnight-30);
    }

    .button--secondary:hover {
      background: var(--colour-midnight-20);
    }

    .button:focus-visible,
    .field__control:focus-visible,
    .skip-link:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 3px;
      box-shadow: 0 0 0 5px rgba(9, 31, 44, 0.85);
    }

    .status-message {
      min-height: 24px;
      margin: 10px 0 0;
      color: var(--colour-midnight);
      font-weight: 700;
    }

    @media (max-width: 768px) {
      .app-shell {
        padding: 16px;
      }

      .builder-layout {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 16px;
        border-radius: 14px;
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }

      .field__control--output {
        min-height: 300px;
      }
    }

    @media (max-width: 420px) {
      body {
        background: linear-gradient(
          180deg,
          var(--colour-midnight) 0,
          var(--colour-midnight) 190px,
          var(--page-background) 190px,
          var(--page-background) 100%
        );
      }

      .app-shell {
        padding: 12px;
      }

      .panel {
        padding: 14px;
      }
    }
    @media (max-width: 768px) {
  textarea.field__control--output {
    min-height: 300px;
  }
}
  </style>
</head>
<body>
  <a class="skip-link" href="#lessonBuilderForm">Skip to lesson builder form</a>

  <main class="app-shell">
    <header class="app-header">
      <h1 class="app-title">AI Lesson Builder AIM</h1>
      <p class="app-description" id="pageDescription">Create a structured AI prompt for lesson planning. Complete the fields, generate the prompt, then copy it into Copilot.</p>
    </header>

    <section class="builder-layout" aria-labelledby="builderHeading" aria-describedby="pageDescription">
      <h2 class="visually-hidden" id="builderHeading">AI lesson builder form and generated prompt</h2>

      <form class="panel" id="lessonBuilderForm" aria-labelledby="lessonDetailsHeading" novalidate>
        <fieldset>
          <legend id="lessonDetailsHeading">Lesson details</legend>

          <div class="field">
            <label class="field__label" for="subject">Subject or course</label>
            <input class="field__control" id="subject" name="subject" type="text" autocomplete="off" placeholder="Example: T Level Digital Support and Security" />
          </div>

          <div class="field">
            <label class="field__label" for="level">Level or year group</label>
            <input class="field__control" id="level" name="level" type="text" autocomplete="off" placeholder="Example: Level 3, Year 12, Adult Level 2" />
          </div>

          <div class="field">
            <label class="field__label" for="topic">Lesson topic</label>
            <input class="field__control" id="topic" name="topic" type="text" autocomplete="off" placeholder="Example: Cyber security threats and vulnerabilities" />
          </div>

          <div class="field">
            <label class="field__label" for="lessonLength">Lesson length</label>
            <input class="field__control" id="lessonLength" name="lessonLength" type="text" autocomplete="off" placeholder="Example: 90 minutes / 2.5 hours" />
          </div>

          <div class="field">
            <label class="field__label" for="priorKnowledge">What do learners already know?</label>
            <textarea class="field__control" id="priorKnowledge" name="priorKnowledge" placeholder="Example: Students know basic network terminology but struggle to explain attack methods clearly."></textarea>
          </div>

          <div class="field">
            <label class="field__label" for="challenge">What do learners struggle with?</label>
            <textarea class="field__control" id="challenge" name="challenge" placeholder="Example: They confuse malware, phishing, social engineering and brute-force attacks."></textarea>
          </div>

          <div class="field">
            <label class="field__label" for="lessonStyle">Lesson style</label>
            <select class="field__control" id="lessonStyle" name="lessonStyle">
              <option value="balanced practical and theory">Balanced practical and theory</option>
              <option value="highly practical">Highly practical</option>
              <option value="theory with discussion and questioning">Theory with discussion and questioning</option>
              <option value="scenario-based">Scenario-based</option>
              <option value="exam-focused">Exam-focused</option>
            </select>
          </div>
        </fieldset>

        <div class="actions actions--form" aria-label="Form actions">
          <button class="button button--primary" type="button" data-action="generate">Generate Prompt</button>
          <button class="button button--secondary" type="reset">Clear Form</button>
        </div>
      </form>

      <section class="panel panel--output" aria-labelledby="generatedPromptHeading">
        <h2 class="panel-title" id="generatedPromptHeading">Generated prompt</h2>
        <label class="visually-hidden" for="promptOutput">Generated AI lesson planning prompt</label>
        <textarea class="field__control field__control--output fclarger" id="promptOutput" readonly placeholder="Your generated prompt will appear here." aria-describedby="copyStatus"></textarea>

        <div class="actions" aria-label="Prompt actions">
          <button class="button button--primary" type="button" data-action="copy">Copy Prompt</button>
        </div>

        <p class="status-message" id="copyStatus" role="status" aria-live="polite"></p>
      </section>
    </section>
  </main>

  <script>
    (() => {
      'use strict';

      const DEFAULT_VALUE = '[add detail]';

      const selectors = {
        form: '#lessonBuilderForm',
        output: '#promptOutput',
        status: '#copyStatus',
        generateButton: '[data-action="generate"]',
        copyButton: '[data-action="copy"]'
      };

      const form = document.querySelector(selectors.form);
      const output = document.querySelector(selectors.output);
      const status = document.querySelector(selectors.status);
      const generateButton = document.querySelector(selectors.generateButton);
      const copyButton = document.querySelector(selectors.copyButton);

      const fieldLabels = {
        subject: 'subject or course',
        level: 'level or year group',
        topic: 'lesson topic',
        lessonLength: 'lesson length',
        priorKnowledge: 'prior knowledge',
        challenge: 'learner challenge',
        lessonStyle: 'lesson style'
      };

      const setStatus = (message = '') => {
        status.textContent = message;
      };

      const getFormValues = () => {
        const formData = new FormData(form);

        return Object.keys(fieldLabels).reduce((values, fieldName) => {
          const value = String(formData.get(fieldName) || '').trim();
          values[fieldName] = value || DEFAULT_VALUE;
          return values;
        }, {});
      };

      const buildPrompt = ({
        subject,
        level,
        topic,
        lessonLength,
        priorKnowledge,
        challenge,
        lessonStyle
      }) => `Actor: Act as an experienced teacher and subject specialist with strong knowledge of effective teaching, assessment, differentiation, adaptive teaching and student engagement.

Input: I am teaching ${subject} to ${level} learners. The lesson topic is ${topic}. The lesson length is ${lessonLength}. Learners already know: ${priorKnowledge}. Learners struggle with: ${challenge}. The lesson should be ${lessonStyle}.

Mission: Create a clear, step-by-step lesson plan. Include:
1. A starter activity to assess prior knowledge and engage learners
2. A clear main teaching phase with explanation, modelling or demonstration
3. An engaging activity where learners apply their learning
4. Differentiation and scaffolded support
5. Stretch and challenge for higher-attaining learners
6. Common misconceptions and how to address them
7. Checks for understanding throughout the lesson
8. A plenary where learners explain what they have learned
9. Teacher guidance, expected answers and suggested timings

Make the lesson practical, accessible and easy for another teacher to deliver.`;

      const generatePrompt = () => {
        output.value = buildPrompt(getFormValues());
        setStatus('Prompt generated. You can now copy it.');
        output.focus();
      };

      const copyUsingFallback = () => {
        output.focus();
        output.select();
        return document.execCommand('copy');
      };

      const copyPrompt = async () => {
        const text = output.value.trim();

        if (!text) {
          setStatus('Generate a prompt first.');
          generateButton.focus();
          return;
        }

        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
          } else if (!copyUsingFallback()) {
            throw new Error('Clipboard fallback failed.');
          }

          setStatus('Prompt copied to clipboard.');
        } catch (error) {
          setStatus('Unable to copy automatically. Select the prompt text and copy it manually.');
        }
      };

      const handleFormReset = () => {
        window.requestAnimationFrame(() => {
          output.value = '';
          setStatus('');
        });
      };

      generateButton.addEventListener('click', generatePrompt);
      copyButton.addEventListener('click', copyPrompt);
      form.addEventListener('reset', handleFormReset);
    })();
  </script>
</body>
</html>
